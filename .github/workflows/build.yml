name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine unit tests (pure Kotlin, JVM)
        run: |
          gradle testReleaseUnitTest --no-daemon --stacktrace -i 2>&1 | grep -E "EngineTest|solve took|carve|calib:|sticker|mean centre|FAILED|PASSED|BUILD|error:|^e: " | head -80
      - name: Build release APK (debug-signed)
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: scan3d-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Commit the APK to the apk branch (private repo; readable without external hosts)
        if: github.ref == 'refs/heads/main'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p /tmp/apkbranch && cp "$APK" /tmp/apkbranch/Scan3D.apk
          cd /tmp/apkbranch
          git init -q && git checkout -q -b apk
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add Scan3D.apk && git commit -qm "APK from ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

  screens:
    # Every screen rendered on an emulator (two screen sizes), screenshots committed to the `screens` branch.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug + test APKs (all ABIs for the x86_64 emulator)
        run: gradle -Pscan3d.allAbis=true assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Run screenshot tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene
          disable-animations: true
          script: bash .github/scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screens/
      - name: Commit screenshots to the screens branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/scr && cp -r screens/. /tmp/scr/ 2>/dev/null || true
          cd /tmp/scr
          [ "$(ls -A)" ] || echo "no screenshots produced" > README.txt
          git init -q && git checkout -q -b screens
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "screens from ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens

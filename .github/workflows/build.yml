name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (debug-signed)
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: scan3d-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Commit the APK to the apk branch (private repo; readable without external hosts)
        if: github.ref == 'refs/heads/main'
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p /tmp/apkbranch && cp "$APK" /tmp/apkbranch/Scan3D.apk
          cd /tmp/apkbranch
          git init -q && git checkout -q -b apk
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add Scan3D.apk && git commit -qm "APK from ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
